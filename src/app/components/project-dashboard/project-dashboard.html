

<!-- src/app/components/project-dashboard/project-dashboard.html -->

<div class="dashboard-page">

  <!-- ── Header ───────────────────────────────────────────────────────────── -->
  <header class="dashboard-header">

    <div class="header-left">
      <button class="back-btn" (click)="onBackToPicker()">
        ‹ All Projects
      </button>

      <div class="header-divider"></div>

      <div class="header-project">
        <span class="header-label">PROJECT</span>
        @if (isLoadingProject) {
          <span class="project-name-skeleton"></span>
        } @else {
          <span class="project-name">{{ projectName }}</span>
        }
      </div>
    </div>

    <div class="header-right">
      <span class="brand-icon">◈</span>
      <span class="brand-name">Project Health Dashboard</span>
    </div>

  </header>

  <main class="dashboard-main">

  <!-- Health always full width at top -->
  <section class="health-section">
    <app-health-panel [hubId]="hubId" [projectId]="projectId" (healthLoaded)="onHealthLoaded($event)" />
  </section>

  <!-- Side by side: panels left, viewer right -->
  <div class="content-area">

    <div class="panel-area">
      <!-- Tab Bar -->
      <nav class="tab-bar">
        @for (tab of tabs; track tab.key) {
          <button
            class="tab-btn"
            [class.tab-btn--active]="isActive(tab.key)"
            [class.tab-btn--stub]="!tab.ready"
            [disabled]="!tab.ready"
            (click)="selectTab(tab)"
            [title]="!tab.ready ? tab.label + ' — coming soon' : ''">
            {{ tab.label }}
            @if (isActive(tab.key) && tabTotal(tab.key) !== null) {
              <span class="tab-count">{{ tabTotal(tab.key) }}</span>
            }
            @if (!tab.ready) {
              <span class="tab-soon">soon</span>
            }
            @if (!tab.ready) {
              <span class="tab-soon">soon</span>
            }
          </button>
        }
      </nav>

      <!-- Tab Content -->
      <section class="tab-content">
        @if (isActive('issues')) {
          <app-issues-panel
            [hubId]="hubId"
            [projectId]="projectId"
            (issueSelected)="onIssueSelected($event)">
          </app-issues-panel>
        }
        @if (isActive('rfi')) {
          <app-rfi-panel [hubId]="hubId" [projectId]="projectId" />
        }
        @if (isActive('submittals')) {
          <app-submittals-panel [hubId]="hubId" [projectId]="projectId" />
        }
        @if (isActive('clashes')) {
          <app-clashes-panel [hubId]="hubId" [projectId]="projectId" />
        }
      </section>
    </div>

    <!-- Viewer — only takes space when visible -->
    @if (viewerTarget) {
      <div class="viewer-area">
        <app-dashboard-viewer
          [target]="viewerTarget"
          (viewerClosed)="onViewerClosed()">
        </app-dashboard-viewer>
      </div>
    }

  </div>

</main>

</div>
