<!-- src/app/components/dashboard-viewer/dashboard-viewer.html
     
     Stays in the DOM always but takes up no space when hidden.
     Slides in from the bottom when isVisible becomes true.
     
     Layout when visible:
     ┌─ viewer-panel ──────────────────────────────────────┐
     │  ┌─ viewer-panel-header ───────────────────────────┐│
     │  │  📍 Issue title          [Reset] [Close]        ││
     │  └────────────────────────────────────────────────┘│
     │  ┌─ viewer-container ─────────────────────────────┐│
     │  │  APS Viewer renders here                       ││
     │  └────────────────────────────────────────────────┘│
     └─────────────────────────────────────────────────────┘
-->

<div class="viewer-panel" [class.visible]="isVisible">

  <!-- ── Panel Header ────────────────────────────────────────────────────── -->
  <div class="viewer-panel-header">

    <div class="header-left">
      <span class="pushpin-icon">📍</span>
      <div class="header-text">
        <span class="header-label">VIEWING ISSUE</span>
        <span class="header-title">{{ activeIssueTitle }}</span>
      </div>
    </div>

    <div class="header-actions">

      <!-- Reset isolation — shows full model again without closing viewer -->
      @if (!isLoading && !error) {
        <button
          class="action-btn"
          title="Show full model"
          (click)="resetView()">
          ⊙ Reset View
        </button>
      }

      <!-- Close viewer -->
      <button
        class="close-btn"
        title="Close viewer"
        (click)="closeViewer()">
        ✕
      </button>

    </div>
  </div>

  <!-- ── Loading overlay ─────────────────────────────────────────────────── -->
  @if (isLoading) {
    <div class="viewer-loading">
      <div class="spinner"></div>
      <span>Loading model…</span>
    </div>
  }

  <!-- ── Error state ─────────────────────────────────────────────────────── -->
  @if (error && !isLoading) {
    <div class="viewer-error">
      <span class="error-icon">⚠</span>
      <span>{{ error }}</span>
    </div>
  }

  <!-- ── Viewer container ────────────────────────────────────────────────── -->
  <!--
    Always in the DOM — the APS Viewer SDK needs a stable DOM element
    to attach to. Hiding via CSS (not *ngIf) preserves the WebGL context.
  -->
  <div
    #viewerContainer
    class="viewer-container"
    [class.hidden]="isLoading || !!error">
  </div>

</div>
